# Cortex configuration (HOCON). Secret is read from the CORTEX_SECRET env var.
play.http.secret.key = "lab-default-change-me"
play.http.secret.key = ${?CORTEX_SECRET}

# Elasticsearch backend
search {
  index = cortex
  uri = "http://cortex-elasticsearch:9200"
}

# Analyzer / responder catalogues
analyzer {
  urls = ["https://download.thehive-project.org/analyzers.json"]
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}
responder {
  urls = ["https://download.thehive-project.org/responders.json"]
}

# Run analyzers as Docker containers (sibling containers via the mounted socket)
job {
  runner = [docker]
}

# Cache analyzer job results to protect free-tier API quotas (VirusTotal/AbuseIPDB).
cache.job = 30 minutes