# Shuffle SOAR stack (frontend + backend + orborus orchestrator + opensearch).
# Adapted from the official Shuffle compose for the soc-lab network:
#  - all services on soc-lab so Wazuh can POST to the webhook and Shuffle can
#    reach TheHive (thehive:9000)
#  - UI/backend bound to 127.0.0.1; OpenSearch NOT published (avoids clashing
#    with the Wazuh indexer on 9200)
#  - secrets/config come from shuffle/.env (copy from shuffle/.env.example)
services:
  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    networks: [soc-lab]
    ports:
      - "127.0.0.1:3001:80"
      - "127.0.0.1:3443:443"
    environment:
      - BACKEND_HOSTNAME=shuffle-backend
    depends_on: [shuffle-backend]
    restart: unless-stopped

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    hostname: shuffle-backend
    networks: [soc-lab]
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shuffle-apps:/shuffle-apps:z
      - ./shuffle-files:/shuffle-files:z
    env_file: .env
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
    restart: unless-stopped

  shuffle-orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    hostname: shuffle-orborus
    networks: [soc-lab]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    environment:
      - SHUFFLE_APP_SDK_TIMEOUT=300
      - ENVIRONMENT_NAME=Shuffle
      - ORG_ID=Shuffle
      - BASE_URL=http://shuffle-backend:5001
      - DOCKER_API_VERSION=1.44
      - SHUFFLE_STATS_DISABLED=true
      - SHUFFLE_LOGS_DISABLED=true
      - SHUFFLE_SWARM_CONFIG=run
      - CLEANUP=false
      - SHUFFLE_WORKER_IMAGE=ghcr.io/shuffle/shuffle-worker:latest
    security_opt: ["seccomp:unconfined"]
    restart: unless-stopped

  shuffle-opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: shuffle-opensearch
    hostname: shuffle-opensearch
    networks: [soc-lab]
    env_file: .env
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - bootstrap.memory_lock=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - cluster.initial_master_nodes=shuffle-opensearch
      - cluster.routing.allocation.disk.threshold_enabled=false
      - cluster.name=shuffle-cluster
      - node.name=shuffle-opensearch
      - node.store.allow_mmap=false
      - discovery.seed_hosts=shuffle-opensearch
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - shuffle-database:/usr/share/opensearch/data:z
    restart: unless-stopped

volumes:
  shuffle-database:

networks:
  soc-lab:
    name: soc-lab
    driver: bridge